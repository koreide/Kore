name: Release

# Push a tag vX.Y.Z (matching crates/kore-app/Cargo.toml) to publish a GitHub release: each
# platform job attaches its files as soon as it is built, then SHA256SUMS is added. Builds are
# not code signed or notarized (macOS apps are ad-hoc signed; install.sh and the in-app updater
# clear the quarantine flag). Run manually (workflow_dispatch) to build artifacts without releasing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read version (and check it matches the tag)
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/kore-app/Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/kore-app/Cargo.toml version $version"
            exit 1
          fi

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Kore $GITHUB_REF_NAME" --notes-file - <<'NOTES'
          See the [CHANGELOG](https://github.com/koreide/Kore/blob/main/CHANGELOG.md) for details.

          **macOS:** `curl -fsSL https://raw.githubusercontent.com/koreide/Kore/main/install.sh | bash`, or download the DMG for your Mac (`aarch64` = Apple Silicon, `x86_64` = Intel). The app is not notarized: if you install from the DMG, run `xattr -dr com.apple.quarantine /Applications/kore.app` once (install.sh does this for you).
          **Windows:** run `kore_*_x64-setup.exe` (per-user install, no admin needed), or unzip the portable build.
          **Linux:** extract `kore_*_x86_64.tar.gz` and run `./install.sh` (installs to `~/.local`).
          NOTES

  macos:
    name: macOS (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and bundle kore.app (ad-hoc signed)
        env:
          TARGET: ${{ matrix.target }}
        run: crates/kore-app/packaging/macos/bundle.sh

      - name: Package DMG
        run: |
          crates/kore-app/packaging/macos/dmg.sh \
            "target/${{ matrix.target }}/release/bundle/macos/kore.app" \
            "dist/kore_${{ needs.version.outputs.version }}_${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  linux:
    name: Linux (x86_64)
    needs: version
    # The oldest supported runner, so the binary links against an older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev \
            libssl-dev libzstd-dev libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p kore-app

      - name: Package tarball
        run: crates/kore-app/packaging/linux/package.sh target/release/kore dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows (x64)
    needs: version
    # GPUI compiles its shaders with fxc.exe from the Windows SDK, so this must be a Windows host.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p kore-app

      - name: Package installer and portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $bin = Join-Path $env:GITHUB_WORKSPACE "target\release\kore.exe"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = "${env:ProgramFiles(x86)}\NSIS"
            if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
            $env:PATH = "$nsis;$env:PATH"
          }
          makensis /V2 "/DVERSION=$version" "/DBIN=$bin" "/DOUT=$dist\kore_${version}_x64-setup.exe" `
            crates\kore-app\packaging\windows\kore.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $bin -DestinationPath "$dist\kore_${version}_x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: Checksums
    if: github.ref_type == 'tag'
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
