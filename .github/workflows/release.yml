name: Release

# Push a tag vX.Y.Z (matching crates/kore-app/Cargo.toml) to build every platform and open a
# draft GitHub release. Run manually (workflow_dispatch) to build the artifacts without releasing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read version (and check it matches the tag)
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/kore-app/Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/kore-app/Cargo.toml version $version"
            exit 1
          fi

  macos:
    name: macOS (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and bundle kore.app
        env:
          TARGET: ${{ matrix.target }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: crates/kore-app/packaging/macos/bundle.sh

      - name: Package DMG (sign + notarize when secrets are set)
        timeout-minutes: 40
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          crates/kore-app/packaging/macos/dmg.sh \
            "target/${{ matrix.target }}/release/bundle/macos/kore.app" \
            "dist/kore_${{ needs.version.outputs.version }}_${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: version
    # The oldest supported runner, so the binary links against an older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev \
            libssl-dev libzstd-dev libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p kore-app

      - name: Package tarball
        run: crates/kore-app/packaging/linux/package.sh target/release/kore dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: version
    # GPUI compiles its shaders with fxc.exe from the Windows SDK, so this must be a Windows host.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p kore-app

      - name: Package installer and portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $bin = Join-Path $env:GITHUB_WORKSPACE "target\release\kore.exe"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = "${env:ProgramFiles(x86)}\NSIS"
            if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
            $env:PATH = "$nsis;$env:PATH"
          }
          makensis /V2 "/DVERSION=$version" "/DBIN=$bin" "/DOUT=$dist\kore_${version}_x64-setup.exe" `
            crates\kore-app\packaging\windows\kore.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $bin -DestinationPath "$dist\kore_${version}_x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Kore ${{ github.ref_name }}"
          body: |
            **macOS:** `curl -fsSL https://raw.githubusercontent.com/koreide/Kore/main/install.sh | bash`, or download the DMG for your Mac (`aarch64` = Apple Silicon, `x86_64` = Intel).
            **Windows:** run `kore_*_x64-setup.exe` (per-user install, no admin needed), or unzip the portable build.
            **Linux:** extract `kore_*_x86_64.tar.gz` and run `./install.sh` (installs to `~/.local`).
          files: dist/*
