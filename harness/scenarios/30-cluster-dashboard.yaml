name: cluster-dashboard
description: >
  Cluster Dashboard renders its six cards from live cluster data - health score ring with label,
  pod health donut legend with counts, node status with CPU/Mem bars, restart hotlist (crashloop),
  pending pods (unschedulable / Unschedulable) and recent warnings (BackOff, FailedScheduling).
tags: [cluster, dashboard]
steps:
  - include: cluster-start
  - shell: {cmd: "kubectl -n kore-demo get pod crashloop -o jsonpath='{.status.containerStatuses[0].restartCount}' | grep -qv '^0$' && echo restarted", expect_output: restarted, retry: 120}
  - shell: {cmd: "kubectl -n kore-demo get pod unschedulable -o jsonpath='{.status.phase}'", expect_output: Pending}
  - click: {text: Dashboard, within: [0, 0.3, 0.19, 1]}
  - wait: {text: CLUSTER HEALTH, timeout: 30}
  - expect: {texts: [CLUSTER HEALTH, POD HEALTH, NODE STATUS, RESTART HOTLIST, PENDING PODS, RECENT WARNINGS], within: [0.19, 0.05, 1, 1]}
  - expect: {texts: ["re:^(Healthy|Degraded|Critical)$", "re:^\\d+ pods across 1 nodes$", "How is this calculated?"], within: [0.19, 0.05, 0.45, 0.45]}
  - expect: {texts: [Running, Pending, Succeeded, Total], within: [0.45, 0.05, 0.72, 0.45]}
  - expect: {texts: [kore-harness-control-plane, Ready, CPU, Mem], within: [0.72, 0.05, 1, 0.45]}
  - expect: {texts: [crashloop, kore-demo], within: [0.19, 0.42, 0.45, 0.8]}
  - expect: {texts: [unschedulable, Unschedulable], within: [0.45, 0.42, 0.72, 0.8]}
  - expect: {texts: [BackOff, FailedScheduling, Pod/crashloop, Pod/unschedulable], within: [0.72, 0.42, 1, 1]}
  - sleep: 1600
  - screenshot:
      name: dashboard
      mask: ["re:^\\d+$", "re:\\d{4}-\\d\\d-\\d\\dT", "re:^x\\d+$", "re:pods across", "re:^\\d+Ki", "re:/ \\d", "re:^\\d+[smhd]( ago)?$", "re:^\\d+/\\d+$", "re:^kore-demo \\d+$", "re:^(Healthy|Degraded|Critical)$", "re:^• (Running|Pending|CrashLooping|Succeeded)"]
      mask_rects: [[0.45, 0.1, 0.6, 0.42], [0.72, 0.5, 1, 1]]
