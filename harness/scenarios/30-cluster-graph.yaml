name: cluster-graph
description: >
  Resource Graph for kore-demo renders the hierarchical layout with count badge, kind filter chips,
  name filter, legend, Fit + zoom label; wheel zoom changes the percentage, drag pans, Fit restores.
tags: [cluster, graph]
steps:
  - include: cluster-start
  - include: cluster-ns-kore-demo
  - click: {text: Graph, within: [0, 0.3, 0.19, 1]}
  - wait: {text: "re:\\d+ edges", timeout: 60}
  - expect: {texts: ["re:nodes", Fit, Filter by name], within: [0.19, 0.05, 1, 0.2]}
  - expect: {texts: [Ingress, Service, Deployment, CronJob, ReplicaSet, Job, Pod], within: [0.19, 0.1, 0.6, 0.18]}
  - expect: {texts: [Service, Pod, Ingress, Job, "re:Cron\\.?Job", ReplicaSet], within: [0.19, 0.9, 0.6, 1]}  # OCR sometimes reads the GPUI legend as "Cron.Job"
  - screenshot: {name: graph-fit, mask: ["re:nodes", "re:edges", "re:%"], mask_rects: [[0.2, 0.07, 0.33, 0.11], [0.93, 0.07, 1, 0.12], [0.2, 0.55, 1, 0.75]]}
  # Wheel zoom anchored on the web Ingress node: names become readable.
  - scroll: {at: [0.59, 0.36], dy: -400}
  - wait: {text: ticker, within: [0.3, 0.2, 1, 0.95], timeout: 5}
  - expect: {texts: [one-shot, logger, "re:^web$"], within: [0.3, 0.2, 1, 0.95]}
  - element: {id: "graph.node.*", label: "^kore-demo-[0-9a-f]+$"}
  - screenshot: {name: graph-zoomed, mask: ["re:nodes", "re:edges", "re:%"], mask_rects: [[0.2, 0.07, 0.33, 0.11], [0.93, 0.07, 1, 0.12], [0.19, 0.2, 1, 1]], tolerance: 0.2}
  # Pan by dragging the background, then Fit back.
  - drag: {from: [0.3, 0.3], to: [0.5, 0.5]}
  - click: {text: Fit, within: [0.8, 0.05, 1, 0.15]}
  - sleep: 500
  - screenshot: {name: graph-refit, mask: ["re:nodes", "re:edges", "re:%"], mask_rects: [[0.2, 0.07, 0.33, 0.11], [0.93, 0.07, 1, 0.12], [0.2, 0.55, 1, 0.75]]}
