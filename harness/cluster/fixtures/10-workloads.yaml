# Deployment whose image is bumped by up.sh to create 3 revisions (rollback tests)
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: kore-demo, labels: {app: web, tier: frontend}}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, tier: frontend}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports: [{containerPort: 80}]
        resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# Continuous loggers: multi-pod log aggregation by label app=logger
apiVersion: apps/v1
kind: Deployment
metadata: {name: logger, namespace: kore-demo, labels: {app: logger}}
spec:
  replicas: 2
  selector: {matchLabels: {app: logger}}
  template:
    metadata: {labels: {app: logger}}
    spec:
      containers:
      - name: log
        image: busybox:1.36
        command: ["sh","-c","i=0; while true; do i=$((i+1)); echo \"KORE-LOG $(hostname) line=$i level=$([ $((i%5)) = 0 ] && echo ERROR || echo INFO)\"; sleep 1; done"]
---
# Multi-container pod (container selector in logs/exec)
apiVersion: v1
kind: Pod
metadata: {name: multi-container, namespace: kore-demo, labels: {app: multi}}
spec:
  containers:
  - name: main
    image: busybox:1.36
    command: ["sh","-c","while true; do echo MAIN-CONTAINER-LOG; sleep 2; done"]
  - name: sidecar
    image: busybox:1.36
    command: ["sh","-c","while true; do echo SIDECAR-CONTAINER-LOG; sleep 2; done"]
---
# CrashLoopBackOff pod (restart sparkline, dashboard hotlist, AI troubleshooting)
apiVersion: v1
kind: Pod
metadata: {name: crashloop, namespace: kore-demo, labels: {app: crashloop}}
spec:
  containers:
  - name: crash
    image: busybox:1.36
    command: ["sh","-c","echo KORE-CRASH about to fail; sleep 3; exit 1"]
---
# Pending pod (unschedulable) for status coloring
apiVersion: v1
kind: Pod
metadata: {name: unschedulable, namespace: kore-demo, labels: {app: pending}}
spec:
  nodeSelector: {kore.dev/does-not-exist: "true"}
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: kore-demo, labels: {app: web}}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: web, namespace: kore-demo}
spec:
  rules:
  - host: web.kore.local
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: web-config, namespace: kore-demo}
data: {LOG_LEVEL: debug, "app.properties": "greeting=hello-from-kore\n"}
---
apiVersion: v1
kind: Secret
metadata: {name: web-secret, namespace: kore-demo}
type: Opaque
stringData: {API_TOKEN: kore-harness-token}
---
apiVersion: batch/v1
kind: Job
metadata: {name: one-shot, namespace: kore-demo}
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: job, image: busybox:1.36, command: ["sh","-c","echo KORE-JOB-DONE"]}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: ticker, namespace: kore-demo}
spec:
  schedule: "0 0 1 1 *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers: [{name: tick, image: busybox:1.36, command: ["date"]}]
