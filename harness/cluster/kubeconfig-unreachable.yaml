# Extra kubeconfig layered onto harness/.kube/config (KUBECONFIG=a:b) by the multi-cluster timeout
# scenario: a context whose API server never answers (non-routable address, dropped SYNs).
apiVersion: v1
kind: Config
clusters:
- name: kore-unreachable
  cluster: {server: "https://10.255.255.1:6443", insecure-skip-tls-verify: true}
users:
- name: kore-unreachable
  user: {token: harness}
contexts:
- name: kore-unreachable
  context: {cluster: kore-unreachable, user: kore-unreachable}
