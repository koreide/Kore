[package]
name = "kore-testkit"
version = "0.2.0"
edition = "2021"
description = "Test doubles for Kore: in-memory Kubernetes API server, connector, fixtures"
publish = false

[dependencies]
kore-core = { path = "../kore-core" }
kube = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = "0.9"
futures = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "net", "io-util", "rt-multi-thread", "macros"] }
anyhow = { workspace = true }
tower = { version = "0.4", features = ["util"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
chrono = "0.4"
tempfile = "3"

[dev-dependencies]
futures = { workspace = true }
